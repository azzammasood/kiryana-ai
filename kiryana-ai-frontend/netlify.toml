# Git-connected Netlify: set env API_BASE_URL to your Render URL (no trailing slash).
# Manual Drop: run scripts/build_web.ps1 first, then upload build/web.

[build]
  base = "kiryana-ai-frontend"
  command = "flutter pub get && flutter build web --release --dart-define=API_BASE_URL=$API_BASE_URL"
  publish = "build/web"

[build.environment]
  API_BASE_URL = "https://kiryana-ai-api.onrender.com"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
